name: GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/events.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /cindy-ml
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_ANALYTICS_GITHUB_REPO: Cindy00F/cindy-ml
          NEXT_PUBLIC_ANALYTICS_GITHUB_TOKEN: ${{ secrets.ANALYTICS_DISPATCH_TOKEN }}
      - run: cp out/index.html out/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: false
